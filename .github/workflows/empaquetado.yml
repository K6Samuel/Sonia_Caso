
name: Empaquetado y Despliegue Automatico

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Validar y Empaquetar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v6

      - name: Comprobar HTML
        run: |
          echo "Comprobando archivo HTML..."

          test -s index.html
          grep -qi '<html' index.html
          grep -qi '</html>' index.html

          echo "Comprobacion basica superada."

      - name: Preparar sitio web
        run: |
          mkdir -p dist
          cp index.html dist/

          echo "Sitio web preparado."

      - name: Crear ZIP
        run: |
          zip proyecto-html.zip index.html README.md
          unzip -t proyecto-html.zip

          echo "ZIP generado correctamente."

      - name: Guardar ZIP
        uses: actions/upload-artifact@v7
        with:
          path: proyecto-html.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio web
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publicar Pagina
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar sitio
        id: deployment
        uses: actions/deploy-pages@v4
