name: Revision Previa a la Entrega

on:
  pull_request:
    branches: [ main ]

jobs:
  revision-codigo:
    name: Buscar Errores y Vulnerabilidades
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escaneo con GitHub Super-Linter
        uses: github/super-linter@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true